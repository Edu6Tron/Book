name: Signed Android Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub Release tag to receive the signed Android artifacts"
        required: true
        type: string

permissions:
  contents: write

jobs:
  sign-and-attach:
    name: Sign and attach Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate signing configuration
        shell: bash
        run: |
          set -euo pipefail
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!variable}" ]; then
              echo "Missing required production signing secret: ${variable}" >&2
              exit 1
            fi
          done

      - name: Restore encrypted keystore
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/spiritual-companion-release.p12"
          chmod 600 "$RUNNER_TEMP/spiritual-companion-release.p12"

      - name: Build signed APK and Android App Bundle
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease \
            -PRELEASE_STORE_FILE="$RUNNER_TEMP/spiritual-companion-release.p12" \
            -PRELEASE_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"

      - name: Calculate artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk release-assets/spiritual-companion-release.apk
          cp app/build/outputs/bundle/release/app-release.aab release-assets/spiritual-companion-release.aab
          (cd release-assets && sha256sum spiritual-companion-release.apk > spiritual-companion-release.apk.sha256)
          (cd release-assets && sha256sum spiritual-companion-release.aab > spiritual-companion-release.aab.sha256)

      - name: Attach signed artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${{ inputs.release_tag }}" release-assets/* --clobber
